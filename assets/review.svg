vious values</text><rect x="24" y="666" width="342" height="54" rx="13" fill="#b91f40" stroke="#b91f40"/><text x="111.64453125" y="696.0" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#f7f7f8">Confirm and save set</text><rect x="24" y="730" width="342" height="54" rx="13" fill="#080809" stroke="#303035"/><text x="130.18359375" y="760.0" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#f7f7f8">Back to exercise</text><rect x="135" y="826" width="120" height="4" rx="2" fill="#b5b7c1" stroke="#b5b7c1"/></svg>