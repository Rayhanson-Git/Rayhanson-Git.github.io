<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 190" width="1280" height="190" role="img" aria-label="Features: hybrid search, a graph you can open, many agents on one vault, and a nightly run that looks after the vault"><defs><radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#6FA0FF" stop-opacity=".42"/><stop offset=".55" stop-color="#3D6BE0" stop-opacity=".12"/><stop offset="1" stop-color="#3D6BE0" stop-opacity="0"/></radialGradient><linearGradient id="wire" x1="0" x2="1"><stop offset="0" stop-color="#8FA3D6" stop-opacity=".25"/><stop offset="1" stop-color="#6FA0FF"/></linearGradient><linearGradient id="wire2" x1="0" x2="1"><stop offset="0" stop-color="#6FA0FF"/><stop offset="1" stop-color="#5ED0E6" stop-opacity=".45"/></linearGradient><pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#25315F" opacity=".7"/></pattern><linearGradient id="mRed" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5E0E0D"/><stop offset="0.22" stop-color="#A31C1B"/><stop offset="0.42" stop-color="#F0635B"/><stop offset="0.5" stop-color="#FFD2CC"/><stop offset="0.58" stop-color="#E0423F"/><stop offset="0.8" stop-color="#8E1716"/><stop offset="1" stop-color="#4A0B0A"/></linearGradient><linearGradient id="mGreen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0E2419"/><stop offset="0.25" stop-color="#1E3A2C"/><stop offset="0.45" stop-color="#5E947A"/><stop offset="0.52" stop-color="#CFE6DA"/><stop offset="0.6" stop-color="#4F8068"/><stop offset="0.82" stop-color="#1C3528"/><stop offset="1" stop-color="#0A1A12"/></linearGradient><linearGradient id="mSteel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4B4944"/><stop offset="0.22" stop-color="#8A8780"/><stop offset="0.44" stop-color="#DAD6CD"/><stop offset="0.5" stop-color="#FFFFFF"/><stop offset="0.58" stop-color="#C9C4B9"/><stop offset="0.8" stop-color="#77736B"/><stop offset="1" stop-color="#3A3835"/></linearGradient><filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="5"/></filter><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8FA3D6"/></marker></defs><rect width="1280" height="190" rx="20" fill="#05071A"/><rect width="1280" height="190" rx="20" fill="url(#dots)"/><rect x="24" y="24" width="296" height="142" rx="16" fill="#0B1130" stroke="#25315F" stroke-width="1.2"/><rect x="42" y="60" width="70" height="70" rx="16" fill="#101A3E" stroke="#25315F"/><circle cx="73" cy="91" r="15" fill="none" stroke="#6FA0FF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M84 102 l12 12" fill="none" stroke="#6FA0FF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M66 91 h14 M69 97 h8" fill="none" stroke="#5ED0E6" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="124" y="82" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#E6ECFF" text-anchor="start">Hybrid search</text><text x="124" y="106" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#9AA8D6" text-anchor="start">Exact words and meaning,</text><text x="124" y="124" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#9AA8D6" text-anchor="start">merged into one ranking.</text><rect x="334" y="24" width="296" height="142" rx="16" fill="#0B1130" stroke="#25315F" stroke-width="1.2"/><rect x="352" y="60" width="70" height="70" rx="16" fill="#101A3E" stroke="#25315F"/><path d="M371 107 L387 79 L404 105 Z M387 79 L388 96 L371 107 M388 96 L404 105" fill="none" stroke="#5ED0E6" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="371" cy="107" r="4.6" fill="#E6ECFF"/><circle cx="387" cy="79" r="4.6" fill="#E6ECFF"/><circle cx="404" cy="105" r="4.6" fill="#E6ECFF"/><circle cx="388" cy="96" r="4.6" fill="#6FA0FF"/><text x="434" y="82" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#E6ECFF" text-anchor="start">A graph you can open</text><text x="434" y="106" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#9AA8D6" text-anchor="start">Entities are real notes,</text><text x="434" y="124" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#9AA8D6" text-anchor="start">visible in Obsidian.</text><rect x="644" y="24" width="296" height="142" rx="16" fill="#0B1130" stroke="#25315F" stroke-width="1.2"/><rect x="662" y="60" width="70" height="70" rx="16" fill="#101A3E" stroke="#25315F"/><circle cx="686" cy="99" r="11" fill="none" stroke="#5ED0E6" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="708" cy="99" r="11" fill="none" stroke="#5ED0E6" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="697" cy="86" r="11" fill="none" stroke="#6FA0FF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="744" y="82" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#E6ECFF" text-anchor="start">Many agents, one vault</text><text x="744" y="106" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#9AA8D6" text-anchor="start">Each agent signs what it</text><text x="744" y="124" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#9AA8D6" text-anchor="start">writes; none overwrite.</text><rect x="954" y="24" width="296" height="142" rx="16" fill="#0B1130" stroke="#25315F" stroke-width="1.2"/><rect x="972" y="60" width="70" height="70" rx="16" fill="#101A3E" stroke="#25315F"/><path d="M1023 93 A 17 17 0 1 0 1017 108" fill="none" stroke="#6FA0FF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M1025 82 v11 h-11" fill="none" stroke="#6FA0FF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M1001 96 l5 5 l9 -11" fill="none" stroke="#5ED0E6" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="1054" y="82" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#E6ECFF" text-anchor="start">Looks after itself</text><text x="1054" y="106" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#9AA8D6" text-anchor="start">A nightly run indexes,</text><text x="1054" y="124" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#9AA8D6" text-anchor="start">checks and reports.</text></svg>
